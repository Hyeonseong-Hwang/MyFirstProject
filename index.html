<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 팀 소개</title>
<style>
  /* 레이아웃: 옅은 회색 바탕 위에 흰 종이 한 장. 구역은 가는 선으로만 나누고, 이름은 왼쪽 열, 소속과 한 줄 소개는 오른쪽 열. */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #20252b;
    --muted: #59636f;
    --line: #e1e5e9;
    --tag-bg: #eef1f4;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171b;
      --surface: #1d2126;
      --ink: #e8ebee;
      --muted: #9aa5b1;
      --line: #2e343b;
      --tag-bg: #2a3037;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171b;
    --surface: #1d2126;
    --ink: #e8ebee;
    --muted: #9aa5b1;
    --line: #2e343b;
    --tag-bg: #2a3037;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 48px;
    padding-inline: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.65;
    word-break: keep-all;
  }
  main {
    max-width: 840px;
    margin: 0 auto;
    background: var(--surface);
    padding: 48px;
    border-radius: 12px;
  }
  .eyebrow {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: .1em;
  }
  h1 {
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1.3;
    margin: 20px 0;
    text-wrap: balance;
  }
  h2 { font-size: 23px; margin: 0 0 12px; text-wrap: balance; }
  p { margin: 0; }
  .tagline { font-size: 20px; color: var(--muted); }

  section {
    margin-top: 36px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
  }
  .note { color: var(--muted); font-size: 14px; margin-top: 4px; }

  /* 팀원 목록 */
  .members { margin: 24px 0 0; padding: 0; list-style: none; }
  .member {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 4px 32px;
    padding: 20px 0;
    border-top: 1px solid var(--line);
  }
  .member:last-child { padding-bottom: 0; }
  .name { min-width: 0; font-weight: 700; font-size: 17px; line-height: 1.5; }
  .info { min-width: 0; }
  .org { font-weight: 600; }
  .desc { color: var(--muted); font-size: 15px; }
  .tag {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 8px;
    border-radius: 5px;
    background: var(--tag-bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    vertical-align: 2px;
  }

  @media (max-width: 620px) {
    .member { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 520px) {
    body { padding-block: 20px; padding-inline: 16px; }
    main { padding: 28px 22px; }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">OUR TEAM</p>
  <h1>우리 팀 소개</h1>
  <p class="tagline">함께 배우고 직접 만들어 보는 팀입니다.</p>

  <section aria-labelledby="members-title">
    <h2 id="members-title">팀원</h2>
    <p id="summary"></p>
    <p class="note">지금 보이는 이름과 소속, 한 줄 소개는 자리를 잡아 둔 예시입니다. 실제 팀원 정보로 바꿔 넣으면 됩니다.</p>
    <ul class="members" id="members"></ul>
  </section>
</main>

<script>
  // 팀원 명단: 이 배열만 고치면 화면이 그대로 따라옵니다.
  // name = 이름, org = 소속, desc = 한 줄 소개
  const MEMBERS = [
    { name: "홍길동", org: "전기공학과",   desc: "한 줄 소개가 들어가는 자리" },
    { name: "김철수", org: "전기공학과",   desc: "한 줄 소개가 들어가는 자리" },
    { name: "이영희", org: "컴퓨터공학과", desc: "한 줄 소개가 들어가는 자리" },
    { name: "박민수", org: "기계공학과",   desc: "한 줄 소개가 들어가는 자리" }
  ];
  const IS_EXAMPLE = true; // 실제 팀원 정보를 넣은 뒤 false로 바꾸면 '예시' 표시가 사라집니다.

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderMembers() {
    const list = document.getElementById("members");
    list.textContent = "";
    for (const member of MEMBERS) {
      const row = el("li", "member");

      const name = el("div", "name", member.name);
      if (IS_EXAMPLE) name.append(el("span", "tag", "예시"));

      const info = el("div", "info");
      info.append(el("div", "org", member.org));
      if (member.desc) info.append(el("div", "desc", member.desc));

      row.append(name, info);
      list.append(row);
    }

    document.getElementById("summary").textContent = "팀원 " + MEMBERS.length + "명이 함께합니다.";
  }

  renderMembers();
</script>
</body>
</html>
